# Declarative pipeline definitions — validated with Pydantic on startup.
#
# This file SEEDS the database. On the first start (empty `pipelines` table) every
# pipeline below is copied into SQLite, which then becomes the source of truth:
# edit pipelines in the dashboard and changes apply immediately, no restart.
# To push later edits of this file into the database run:
#     python main.py --sync-config
#
# Never put API keys or bot tokens here — reference environment variables by NAME.

pipelines:
  - id: "sports_he"
    enabled: true
    niche: "running_and_sports"
    language: "he"
    source: "aliexpress_mock"          # plugins/sources/aliexpress_mock.py
    generator: "llm_text_gen"          # plugins/generators/llm_text_gen.py
    llm_provider: "anthropic"          # or pin a model: llm_model: "claude-opus-5-5" | "gemini-3.5-flash-lite" | "mock"
    publishers: ["console_pub", "telegram_pub"]
    publishing_mode: "immediate"       # immediate | queued
    limit: 5                           # products handled per run
    filters:
      min_rating: 4.5
      min_orders: 200
    # Per-page credentials: the NAMES of the env vars that hold them.
    # A publisher listed above without an entry here uses its default env vars.
    social_pages:
      - platform: "telegram_pub"
        page_name: "@my_sports_channel"
        token_env_var: "TG_SPORTS_BOT_TOKEN"
        chat_id_env_var: "TG_SPORTS_CHAT_ID"

  # Real Temu gadgets (RapidAPI) ➔ Hebrew captions ➔ console + Instagram, paced by the queue worker.
  # Live runs walk the provider chain in config/temu_providers.yaml (needs RAPIDAPI_KEY or the
  # per-provider keys); a --dry-run spends no quota and previews the products stored by
  #     python main.py --seed-temu --category gadgets --keyword "smart gadgets" --limit 10
  - id: "gadgets_he"
    enabled: true
    category: "gadgets"
    language: "he"
    source: "temu_rapidapi"            # plugins/sources/temu_rapidapi.py — provider chain with failover
    generator: "llm_text_gen"
    llm_model: "claude-sonnet-5-5"
    publishers: ["console_pub", "instagram_pub"]
    publishing_mode: "queued"
    filters:                           # applied locally to the fetched batch
      min_rating: 4.5
      min_orders: 500
    options:
      search_config:                   # search terms, passed to the providers that support them
        keyword: "tech gadgets"
        l1Category: "Electronics & Appliances"   # a top-level Temu category (l2Category = sub-category)
        priceMin: 1
        priceMax: 100
    social_pages:
      - platform: "instagram_pub"
        page_name: "gadgets"
        token_env_var: "INSTAGRAM_ACCESS_TOKEN"
        account_id_env_var: "INSTAGRAM_BUSINESS_ACCOUNT_ID"
