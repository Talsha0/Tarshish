[pytest]
testpaths = tests
# Keep test temp files inside the project instead of the shared %TEMP%\pytest-of-<user> folder.
# That folder holds a "pytest-current" link which, once created from an elevated terminal, cannot be
# cleaned up from a normal one and makes pytest end with a PermissionError even though every test passed.
# The cache plugin (only used by --lf/--ff) is off for the same reason: a .pytest_cache folder
# created from an elevated terminal is unreadable from a normal one and every run warns about it.
addopts = --basetemp=.pytest_tmp -p no:cacheprovider
filterwarnings =
    ignore:.*invalid escape sequence.*:SyntaxWarning
